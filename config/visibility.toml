# V1 AI-visibility settings (build step 3). Read with stdlib tomllib; no secrets here.
#
# All LLM calls go through OpenRouter (one key, one bill): https://openrouter.ai/docs
# Web search: OpenRouter server tool {"type": "openrouter:web_search", "parameters":
#   {"engine": "native", "max_uses": ...}} — the `web` plugin and `:online` suffix are
#   deprecated (https://openrouter.ai/docs/features/web-search, read 2026-11-09).
# "native" = the provider's own search (what the real assistant would use).
#
# Prices: read LIVE at scan time from GET https://openrouter.ai/api/v1/models (public).
# The snapshot numbers below (USD, 2026-11-09) are for planning and as a fallback estimate.
# Actual cost per call is taken from the response (`usage.cost`) and written to the ledger.

[budget]
# Tarek, 2026-11-09: max EUR 10 per month in total. OpenRouter bills in USD; a USD 10 cap
# stays at or below EUR 10 as long as 1 EUR >= 1 USD.
monthly_usd = 10.00
# Hard per-scan ceiling (pre-run estimate AND before every paid call). Measured live
# 2026-11-09: a full ChatGPT + Gemini run (40 calls) costs ~ USD 1.15 — approved by Tarek.
# The ceiling sits above that because each in-flight call reserves its worst case
# (worst_case_searches) before it starts; the monthly cap still limits the total.
per_scan_usd = 1.40
# Local ledger of actual costs (gitignored scans/ dir); month = UTC calendar month,
# matching OpenRouter's monthly key-limit reset (1st, 00:00 UTC).
ledger_path = "scans/visibility_ledger.jsonl"
# Also set this limit on the OpenRouter key itself (limit 10, limit_reset "monthly");
# OpenRouter then refuses calls with HTTP 402 even if our own guard had a bug.

[run]
brand_questions = 2          # SPEC: 2 brand + 8 non-brand
category_questions = 8       # built from the scanned shop's category names (Tarek)
runs = 2                     # SPEC: run 2x and report both (non-deterministic)
language = "nl"
country = "NL"               # put "in Nederland" in the prompt text: Google native search
                             # has no location parameter
max_searches_per_question = 1   # server tool max_uses — NOT honoured by native search
                                # (live 2026-11-09: ChatGPT 1-2, Gemini 2-3 searches)
worst_case_searches = 3         # reserved per call before it starts (max seen live)
add_search_fee_to_cost = false  # verified live 2026-11-09: usage.cost already includes the
                                # search fee (matches /generation total_cost and the key's
                                # usage_monthly to the cent)
concurrency = 4
timeout_s = 90

[privacy]
# Ask OpenRouter to route only to providers that do not train on our prompts.
data_collection = "deny"

# --- Assistants (Tarek, 2026-11-09: ChatGPT + Gemini) -------------------------------------
# per_question_usd = web_search fee + ~4k input / 600 output tokens at snapshot prices.

[[assistants]]
name = "ChatGPT"
model = "openai/gpt-6-luna"          # current OpenAI generation with native web search
engine = "native"
snapshot = { prompt_per_m = 0.10, completion_per_m = 0.50, web_search = 0.010 }
per_question_usd = 0.0186     # measured live 2026-11-09 (avg of 20 calls)
expected_searches = 1.7       # measured live 2026-11-09

[[assistants]]
name = "Gemini"
model = "google/gemini-3.1-flash-lite"   # on OpenRouter's native Google search list
engine = "native"
snapshot = { prompt_per_m = 0.25, completion_per_m = 1.50, web_search = 0.014 }
per_question_usd = 0.0383     # measured live 2026-11-09 (avg of 6 calls)
expected_searches = 2.7       # measured live 2026-11-09

# --- Alternatives (not active; swap in by copying into [[assistants]]) ---------------------
# Perplexity  perplexity/sonar             native  ws 0.005  ~ USD 0.0096/question (cheapest
#             native "answer engine"; consumers use Perplexity directly)
# Claude      anthropic/claude-haiku-5.5   native  ws 0.010  ~ USD 0.0107/question
# Grok        x-ai/grok-4.3                native  ws 0.005  ~ USD 0.0115/question
# ChatGPT-alt openai/gpt-5-nano            native  ws 0.010  ~ USD 0.0104/question (older gen)
# Budget, NOT representative of a real assistant:
#             openai/gpt-oss-20b + engine "parallel" (USD 0.001/search) ~ USD 0.0013/question.
#             Measures "an AI with a generic search index", not what ChatGPT/Gemini show
#             shoppers — only label it as such if ever used.
#
# Cost per scan (questions x runs x assistants), MEASURED live 2026-11-09:
#   ChatGPT + Gemini,     2 runs: 40 calls ~ USD 1.14 -> ~8 scans / USD 10 month
#   ChatGPT + Gemini,     1 run : 20 calls ~ USD 0.57 -> ~17 scans
#   ChatGPT only,         2 runs: 20 calls ~ USD 0.37 -> ~26 scans
#   ChatGPT + Perplexity, 2 runs: 40 calls ~ USD 0.57 (Perplexity per-search count not
#                                  measured yet) -> ~17 scans
