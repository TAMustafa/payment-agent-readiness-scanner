[project]
name = "ap2-readiness-check"
version = "0.2.0"
description = "Read-only website + CLI that checks whether a merchant is set up to accept AP2 (Agent Payments Protocol) payment requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "typer==0.28.0",
    "uvicorn==0.54.0",
]

[project.scripts]
ap2check = "ap2check.cli:app"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ap2check"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
